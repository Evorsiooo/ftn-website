name: Scheduled webradio password rotation

on:
  schedule:
    # Hourly; the endpoint only rotates when the schedule set in Radio settings is due
    - cron: '5 * * * *'
  workflow_dispatch:

jobs:
  rotate:
    name: Rotate broadcast password if due
    runs-on: ubuntu-latest
    steps:
      - name: Ping rotation endpoint
        env:
          RADIO_CRON_SECRET: ${{ secrets.RADIO_CRON_SECRET }}
        run: |
          curl -s -f --max-time 60 -X POST -H "x-cron-secret: $RADIO_CRON_SECRET" "https://ftn.euno.cc/api/radio/rotate-cron"
