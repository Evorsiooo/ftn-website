name: Send scheduled posts

on:
  schedule:
    # Every 5 minutes (GitHub's minimum); the endpoint only sends posts whose time has come
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  send:
    name: Send due scheduled posts
    runs-on: ubuntu-latest
    steps:
      - name: Ping scheduled posts endpoint
        env:
          RADIO_CRON_SECRET: ${{ secrets.RADIO_CRON_SECRET }}
        run: |
          curl -s -f --max-time 120 -X POST -H "x-cron-secret: $RADIO_CRON_SECRET" "https://ftn.euno.cc/api/posts/schedule-cron"
